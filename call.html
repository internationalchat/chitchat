<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice Call</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Times New Roman", serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:linear-gradient(160deg,#08111f,#10253b,#0a1624);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

.header{
    width:100%;
    padding:20px;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.title{
    font-size:28px;
    margin-bottom:30px;
    font-weight:bold;
}

.avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid rgba(255,255,255,.4);
    margin-bottom:25px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.number{
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

.status{
    font-size:20px;
    color:#79d4ff;
}

.footer{
    width:100%;
    display:flex;
    justify-content:center;
    padding:35px;
}

.end-call{
    width:75px;
    height:75px;
    border-radius:50%;
    border:none;
    background:#d62828;
    color:white;
    font-size:28px;
    cursor:pointer;
}
@keyframes pulse {
    0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(121,212,255,.6);
    }

    70% {
        transform: scale(1.08);
        box-shadow: 0 0 0 25px rgba(121,212,255,0);
    }

    100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(121,212,255,0);
    }
}

.avatar{
    animation:pulse 1.8s infinite;
}

</style>

</head>

<body>

<div class="header">
    <a href="chat.html" class="back-btn">← Back</a>
</div>

<div class="main">

    <div class="title">Voice Call</div>

    <div class="avatar">
        <img src="https://i.postimg.cc/rw3H8CwT/IMG-20251218-WA0011.jpg">
    </div>

    <div class="number">
        +1 585 393 2000
    </div>
<div class="status" id="status">
    Voice calling...
</div>

</div>
<div class="footer">
    <button class="end-call" onclick="location.href='chat.html'">
        📞
    </button>
</div>

<script>
const status = document.querySelector(".status");

let dots = 0;

// Animate "Voice calling..."
const animation = setInterval(() => {
    dots = (dots + 1) % 4;
    status.textContent = "Voice calling" + ".".repeat(dots);
}, 500);

// After 5 seconds
setTimeout(() => {
    clearInterval(animation);
    status.textContent = "Unable to connect";
    status.style.color = "#ff6b6b";
}, 5000);

// After 7 seconds
setTimeout(() => {
    window.location.href = "chat.html";
}, 7000);
</script>

</body>
</html>
