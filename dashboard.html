<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChitChat Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Times New Roman", Times, serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            background: #030712;
        }

        .dashboard {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            min-height: 95vh;
            margin: auto;
            background: rgba(6,20,15,0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(52,211,153,0.25);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 0 35px rgba(16,185,129,0.25);
            overflow-y: auto;
        }

        .profile-card {
            text-align: center;
        }

        .profile-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #34d399;
            box-shadow: 0 0 25px rgba(52,211,153,0.5);
            cursor: pointer;
        }

        .add-profile {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg,#059669,#34d399);
            color: #022c22;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .username {
            margin-top: 18px;
            color: #34d399;
            font-size: 28px;
            font-weight: bold;
        }

        .phone {
            margin-top: 8px;
            color: #d1fae5;
            font-size: 18px;
        }

        .search-section {
            margin-top: 30px;
        }

        .search-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #022c22;
            background: linear-gradient(135deg,#059669,#34d399);
            box-shadow: 0 0 20px rgba(52,211,153,.4);
            transition: .3s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(52,211,153,.6);
        }

        .result-area {
            margin-top: 30px;
            min-height: 100px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(52,211,153,.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-area h2 {
            color: #34d399;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .result-area p {
            color: #d1fae5;
            font-size: 18px;
            line-height: 1.7;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3,7,18,.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-card {
            width: 90%;
            max-width: 360px;
            background: rgba(6,20,15,.95);
            border: 1px solid #34d399;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(52,211,153,.35);
        }

        .popup-card h2 {
            color: #34d399;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .popup-card select,
        .popup-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: #0b2f25;
            color: white;
            font-size: 16px;
        }

        .popup-buttons {
            display: flex;
            gap: 10px;
        }

        .popup-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #cancelSearch {
            background: #6b7280;
            color: white;
        }

        #startSearch {
            background: #10b981;
            color: #022c22;
        }

        .chat-title {
            color: #34d399;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 24px;
            text-align: center;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-item {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(52,211,153,.25);
            border-radius: 15px;
            padding: 15px;
            color: white;
            cursor: pointer;
            transition: .3s;
        }

        .chat-item:hover {
            background: rgba(52,211,153,.15);
        }

        .no-chat {
            text-align: center;
            color: #b6e7d5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 14px 22px;
            border-radius: 30px;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,.3);
            opacity: 0;
            pointer-events: none;
            transition: .4s;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            bottom: 50px;
        }

        @media (max-width: 600px) {
            body { padding: 0; }  
            .dashboard {  
                width: 100%;  
                max-width: 100%;  
                min-height: 100vh;  
                border-radius: 0;  
                padding: 20px;  
            }  
            .profile-image { width: 140px; height: 140px; }  
            .username { font-size: 30px; }  
            .phone { font-size: 18px; }  
            .search-btn { font-size: 22px; padding: 18px; }  
            .result-area { min-height: 220px; }  
            .chat-title { font-size: 28px; }  
            .chat-item { padding: 18px; }
        }
    </style>
</head>  
<body>  
    <div class="dashboard">  
        <div class="profile-card">  
          <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" id="profileImage" class="profile-image" alt="Profile">  
            <br>  
            <button class="add-profile" id="addProfileBtn">Add Profile</button>  
            <h2 class="username" id="username">Loading...</h2>  
            <p class="phone" id="phoneNumber">Loading...</p>  
        </div>

        <div class="search-section">  
            <button id="searchContactBtn" class="search-btn">🔍 Search Contact</button>
        </div> 

        <div class="result-area" id="resultArea">
            <h2>ChitChat</h2>
            <p>Search for a contact to begin a private conversation.</p>
        </div>

        <h2 class="chat-title">Recent Chats</h2> 
        <div id="chatList" class="chat-list">
            <p class="no-chat">No chats yet.</p>
        </div>
    </div>  

    <div id="searchPopup" class="popup-overlay">  
        <div class="popup-card">  
            <h2>Search Contact</h2>  
            <select id="countryCode">  
                <option value="+1"> United states (+1)</option>  
                <option value="+254"> Kenya (+254)</option>  
                <option value="+44"> United Kingdom (+44)</option>  
                <option value="+91"> India (+91)</option>  
                <option value="+27"> South Africa (+27)</option>  
                <option value="+234"> Nigeria (+234)</option>  
                <option value="+61"> Australia (+61)</option>  
            </select>  
            <input type="tel" id="contactNumber" placeholder="Phone Number">  
            <div class="popup-buttons">  
                <button id="cancelSearch">Cancel</button>  
                <button id="startSearch">Search</button>  
            </div>  
        </div>
    </div>  

    <input type="file" id="profileInput" accept="image/*" hidden>
    <div id="toast" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
        import {
          getFirestore,
          doc,
          setDoc,
          getDoc,
          updateDoc,
          arrayUnion
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCrnOtYqjXvFZOXNFYa60gazS9-KRB3fX8",
          authDomain: "chat-ef6f2.firebaseapp.com",
          projectId: "chat-ef6f2",
          storageBucket: "chat-ef6f2.firebasestorage.app",
          messagingSenderId: "971352096063",
          appId: "1:971352096063:web:25aa2737582e236857678a",
          measurementId: "G-45J1XLK92R"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
            
        const popup = document.getElementById("searchPopup");
        const openBtn = document.getElementById("searchContactBtn");
        const cancelBtn = document.getElementById("cancelSearch");

        openBtn.onclick = function () {
            popup.classList.add("active");
        };

        cancelBtn.onclick = function () {
            popup.classList.remove("active");
        };

        document.getElementById("startSearch").onclick = async function () {
            const code = document.getElementById("countryCode").value;
            const number = document.getElementById("contactNumber").value.trim();

            if (number === "") {
                alert("Please enter a contact number.");
                return;
            }

            const fullNumber = code + number;

            if (fullNumber === "+15853932000") {
                const user = auth.currentUser;
                if (user) {
                    await updateDoc(doc(db, "users", user.uid), {
                        recentChats: arrayUnion(fullNumber)
                    });
                }
                // FIXED: Relative redirect keeps you inside your active repository
window.location.href = "chat.html";
                return;
            }

            popup.classList.remove("active");
            showNotFoundPopup();
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            const snap = await getDoc(doc(db, "users", user.uid));

            if (snap.exists()) {
                const data = snap.data();

                document.getElementById("username").textContent = data.username || "User";
                document.getElementById("phoneNumber").textContent = data.phone || "";
                if (data.profileImage) {
                    profileImage.src = data.profileImage;
                }

                const chatList = document.getElementById("chatList");

                if (data.recentChats && data.recentChats.length > 0) {
                    chatList.innerHTML = "";
                    data.recentChats.forEach(number => {
                        const chat = document.createElement("div");
                        chat.className = "chat-item";
                        chat.innerHTML = `
                            <strong>${number}</strong><br>
                            <small>Tap to continue chatting</small>
                        `;

                        chat.onclick = () => {
                            if (number === "+15853932000") {
                                // FIXED: Relative redirect keeps you inside your active repository
window.location.href = "chat.html";
                            }
                        };
                        chatList.appendChild(chat);
                    });
                }
            }
        });

        const addProfileBtn = document.getElementById("addProfileBtn");  
        const profileInput = document.getElementById("profileInput");  
        const profileImage = document.getElementById("profileImage");  
          
        addProfileBtn.addEventListener("click", () => {  
            profileInput.click();  
        });  
          
        profileImage.addEventListener("click", () => {  
            profileInput.click();  
        });  

        profileInput.addEventListener("change", async () => {
            showToast("📷 Preparing your profile photo...");

            const file = profileInput.files[0];
            if (!file) return;
            showToast("📷 Profile photo selected");

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "Hyatt rochester");

            try {
                showToast("Uploading profile...");
                const response = await fetch(
                    "https://api.cloudinary.com/v1_1/nfqodks2/image/upload",
                    { method: "POST", body: formData }
                );

                if (!response.ok) return;

                const data = await response.json();
                const imageUrl = data.secure_url;
                profileImage.src = imageUrl;

                const user = auth.currentUser;
                if (user) {
                    await updateDoc(doc(db, "users", user.uid), {
                        profileImage: imageUrl
                    });
                }

                showToast(" Your profile has been updated");
            } catch (error) {
                console.error("Cloudinary upload failed:", error);
            }
        }); 

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function showNotFoundPopup() {
            const resultArea = document.getElementById("resultArea");
            resultArea.innerHTML = `
                <h2 style="color:#ef4444;">❌ Number Not Found</h2>
                <p style="color:white;font-size:18px;">
                    The number you searched was not found.<br><br>
                    Please check the country code and phone number, then try again.
                </p>
            `;

            setTimeout(() => {
                resultArea.innerHTML = `
                    <h2>ChitChat</h2>
                    <p>Search for a contact to begin a private conversation.</p>
                `;
            }, 3000);
        }
    </script>
</body>
</html>
